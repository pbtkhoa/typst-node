[package]
authors = ["Khoa Pham <pbtkhoa@gmail.com>"]
edition = "2021"
name = "typst_node"
version = "1.0.0"
description = "High-performance, zero disk I/O programmatic Typst compiler and renderer for Node.js"
repository = "https://github.com/pbtkhoa/typst-node"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
napi-derive = "3.6.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

typst = "0.14"
typst-pdf = "0.14"
typst-render = "0.14"
typst-svg = "0.14"
typst-kit = { version = "0.14", default-features = false, features = ["fonts", "embed-fonts"] }

[dependencies.napi]
version = "3.12.4"
features = ["napi4", "async", "serde-json"]

[build-dependencies]
napi-build = "2.4.2"

[profile.release]
lto = true
strip = "symbols"
